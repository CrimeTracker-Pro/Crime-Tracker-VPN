# Build overlay — adds `build:` to the app services so their images can be
# built locally. The base docker-compose.yml supplies local image names.
#
#   Build + tag:  docker compose -f docker-compose.yml -f docker-compose.build.yml build   (make images)
#   Local run:    docker compose -f docker-compose.yml -f docker-compose.build.yml --profile dev up -d --build   (make up)
#
# Each service keeps the `image:` from the base file, so `build` gives it a
# local ${ZEROVPN_REGISTRY}/...:${ZEROVPN_IMAGE_TAG} tag.
#
# Deploy hosts are x86_64, so builds target linux/amd64 regardless of the
# build machine (on an Apple Silicon Mac this cross-builds via Rosetta —
# slower, but the built image runs on the server). Set
# ZEROVPN_BUILD_PLATFORM=linux/arm64 for a fast native image for `make up`.
services:
  policy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.policy
      platforms: ["${ZEROVPN_BUILD_PLATFORM:-linux/amd64}"]
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      platforms: ["${ZEROVPN_BUILD_PLATFORM:-linux/amd64}"]
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
      platforms: ["${ZEROVPN_BUILD_PLATFORM:-linux/amd64}"]
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      platforms: ["${ZEROVPN_BUILD_PLATFORM:-linux/amd64}"]
