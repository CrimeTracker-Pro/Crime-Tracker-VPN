name: images (build only)

# Validate local Docker builds. Never log in to or push to a registry.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build images without publishing
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build local images
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml build api worker frontend
