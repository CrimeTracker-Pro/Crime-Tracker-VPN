[workspace]
resolver = "3"
members = [
    "crates/zerovpn-core",
    "crates/zerovpn-db",
    "crates/zerovpn-wg",
    "crates/zerovpn-auth",
    "crates/zerovpn-events",
    "crates/zerovpn-wire",
    "crates/zerovpn-mail",
    "crates/zerovpn-api",
    "crates/zerovpn-worker",
    "crates/zerovpn-cli",
]
exclude = ["tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["ZeroVPN contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/bhadri01/ZeroVPN"
readme = "README.md"

[workspace.dependencies]
# Internal crates
zerovpn-core = { path = "crates/zerovpn-core" }
zerovpn-db = { path = "crates/zerovpn-db" }
zerovpn-wg = { path = "crates/zerovpn-wg" }
zerovpn-auth = { path = "crates/zerovpn-auth" }
zerovpn-events = { path = "crates/zerovpn-events" }
zerovpn-wire = { path = "crates/zerovpn-wire" }
zerovpn-mail = { path = "crates/zerovpn-mail" }

# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "compression-br", "limit", "request-id", "set-header", "timeout"] }
# tower-sessions-sqlx-store@0.15.0 still pins tower-sessions-core to 0.14,
# so we use tower-sessions 0.14 to match. Bump both together when the store
# catches up.
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }

# Async runtime
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync", "io-util", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Database
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "uuid", "time", "ipnetwork", "json"] }

# Auth / crypto
argon2 = "0.5.3"
totp-rs = { version = "5.7", features = ["gen_secret", "qr"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"

# Validation / serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
garde = { version = "0.22", features = ["derive", "email", "pattern", "url"] }

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Logging / metrics / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
# Host metrics for the server_health emitter (CPU%, memory, net I/O, disk I/O, uptime).
sysinfo = { version = "0.32", default-features = false, features = ["system", "network", "disk"] }

# OpenAPI
utoipa = { version = "5.5", features = ["axum_extras", "uuid", "time"] }

# IDs / time / encoding
uuid = { version = "1.23", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing"] }
# Pinned to 0.20 to match sqlx 0.8.6's internal ipnetwork dep — having two
# versions in the graph means our IpNetwork type doesn't satisfy
# sqlx::Type<Postgres>. Bump to 0.21 once sqlx upgrades.
ipnetwork = { version = "0.20", features = ["serde"] }
url = { version = "2.5", features = ["serde"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "json", "gzip", "http2"] }

# GeoIP
maxminddb = "0.24"

# Email
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }
askama = "0.16"

# QR / images
qrcode = "0.14"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
inquire = "0.7"
dotenvy = "0.15"

# Config
figment = { version = "0.10", features = ["env", "toml"] }

# WG
defguard_wireguard_rs = "0.9"
boringtun = "0.7"

# ZeroMQ (pure Rust)
zeromq = { version = "0.6", default-features = false, features = ["tokio-runtime", "tcp-transport"] }

# Concurrent data structures
dashmap = "6.1"
ahash = "0.8"
arraydeque = "0.5"
compact_str = { version = "0.8", features = ["serde"] }
fixedbitset = "0.5"
smallvec = { version = "1.13", features = ["serde", "union"] }

# Cron / scheduling
tokio-cron-scheduler = "0.15"

# Atomic helpers
arc-swap = "1.7"

# Lazy
once_cell = "1.20"

# Regex
regex = "1.10"

[profile.release]
# `thin` LTO + 16 codegen-units keeps the linker memory footprint reasonable
# (~1.5 GB) while still delivering near-`fat` perf. `fat` LTO with
# codegen-units=1 needed >8 GB and OOMed the Docker Desktop build.
opt-level = 3
lto = "thin"
codegen-units = 16
strip = "symbols"
panic = "abort"
debug = false

# Use this profile for production releases on a fat builder where time and
# memory aren't constrained: `cargo build --profile release-fat`.
[profile.release-fat]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.release-min]
inherits = "release"
opt-level = "z"

[profile.dev]
opt-level = 0
incremental = true
debug = "line-tables-only"

# Speed up dev builds while linking against optimized deps
[profile.dev.package."*"]
opt-level = 3
